# Config for scripts/teleop.py — load with CONFIG=teleop_ftr.yaml bash scripts/teleop.sh
robot_type: ftr
terrain: cur_mixed
num_envs: 1
device: cuda:0
js: /dev/input/js0

# Pin every reset to a specific terrain_cfg.birth spawn point instead of the env's normal
# round-robin cycling, so the same obstacle/terrain section is reproducible across runs.
# null -> normal cycling behavior. Run with --list_spawns to see available indices.
# Pinned to 0 (the box obstacle near world (24,23) used for all the MARV stick-slip/
# chatter A-B tests this session) so FTR can be tested on the identical obstacle.
spawn_index: 0

v_sensitivity: 0.95
w_sensitivity: 1.5
flipper_sensitivity: 0.4
dead_zone: 0.05

# Original task default (episode_length_s=30, decimation=5, sim_dt=0.005) truncates and
# respawns the env every 1200 steps, which cuts off manual driving/climbing sessions.
# A very large value effectively disables the timeout for teleop use.
episode_length_s: 1000000.0

# wheel1 (the lead, big-radius wheel on every flipper) intermittently gets its joint
# velocity kicked to a large negative value under load. Track it live during teleop to
# check whether FTR shows the same glitch as MARV under comparable load.
track_wheel1_glitch: true
glitch_vel_threshold: -10.0  # rad/s — flag a step where any wheel1 joint velocity drops below this
glitch_log: null             # null -> auto path under logs/teleop_wheel1_<timestamp>.csv

# Match the Optuna-tuned solver/timestep settings from configs/ftr_config_optuna_best_v5.yaml —
# parse_env_cfg's registered defaults happen to equal these for FTR (FTR_SIM_CFG/FTR_CFG
# already use 16/4/0.0025/0.15), kept explicit here for parity with the MARV config.
solver_position_iterations: 16
solver_velocity_iterations: 4
sim_dt: 0.0025
max_depenetration_velocity: 0.15
