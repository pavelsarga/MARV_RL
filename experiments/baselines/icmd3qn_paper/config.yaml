name: icmd3qn_marv_paper
comment: 'BUG-FIXES-ONLY ablation of ICM-D3QN: the paper''s reward semantics throughout,
  with none of the MARV-morphology adaptations. See the module_cfg_overrides block
  at the end of this file for exactly what is and is not applied. ICM-D3QN (Pan et
  al. 2023, "...Urban Rescuing Environments") flipper policy, reusing marv_asym_limits.yaml''s
  robot/terrain/reward parameters. Front/rear flipper pairs only (2-DOF, 9-action
  discrete space) — requires sync_flipper_control: true below, which deviates from
  marv_asym_limits.yaml''s 4-independent-flipper default. If you need true per-corner
  MARV control, the Q-network''s action space (currently 3x3=9) needs extending to
  3^4=81 and is out of scope for this config.'
use_wandb: true
use_tensorboard: false
seed: 42
device: cuda
training_dtype: ${dtype:float32}
num_robots: 1024
task: Ftr-Crossing-Direct-v0
terrain: pan_symmetric
total_frames: 20840448
time_steps_per_batch: 128
eval_and_save_every: 8
eval_repeats: 2
eval_repeats_after_training: 20
max_grad_norm: 0.697298401413678
clip_grad_norm_p: 2
replay_buffer_capacity: 8000000
min_replay_size: 131072
batch_size: 256
updates_per_batch: 64
gamma: 0.995
target_update_interval: 1000
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_iters: 240
optimizer: ${cls:torch.optim.AdamW}
optimizer_opts:
  lr: 0.0005
  weight_decay: 0.0001
scheduler: ${cls:torch.optim.lr_scheduler.LinearLR}
scheduler_opts:
  start_factor: 1.0
  end_factor: 0.8
  total_iters: 240
data_collector_opts:
  split_trajs: false
policy_opts:
  track_vel: 0.6
  hm_hidden: 32
  hm_out: 4
  fusion_hidden: 16
ftr_obs_encoder_opts:
  hm_hidden: 32
  hm_out: 4
  fusion_hidden: 16
icm_opts:
  encoder_hidden:
  - 32
  - 64
  feature_dim: 10
  forward_hidden: 32
  inverse_hidden: 32
  eta: 1.0
icm_optimizer_opts:
  lr: 0.0005
  weight_decay: 0.0001
icm_beta_forward: 0.8
icm_beta_inverse: 0.2
icm_weights_path: null
vecnorm_opts:
  decay: 0.99
  eps: 0.0001
vecnorm_on_reward: false
extra_env_transforms: []
policy_weights_path: null
vecnorm_weights_path: null
robot_max_linear_velocity: 10.0
robot_max_angular_velocity: 720.0
physx_gpu_heap_capacity: 2147483648
physx_gpu_temp_buffer_capacity: 1073741824
physx_gpu_max_num_partitions: 8
solver_position_iterations: 5
solver_velocity_iterations: 1
max_depenetration_velocity: 0.12354395702544713
sim_dt: 0.005
decimation: 20
env_cfg_overrides:
  module_name: icmd3qn
  sync_flipper_control: true
  flipper_control_mode: increment
  flipper_angle_increment_deg: 15.0
  fixed_forward_vel: 0.6
  robot_type: marv
  goal_reached_reward: 2
  failed_reward: -2
  timeout_penalty: -2
  shock_scale: 4
  marv_flipper_front_up_deg: 90.0
  marv_flipper_front_down_deg: 80.0
  marv_flipper_back_up_deg: 90.0
  marv_flipper_back_down_deg: 80.0
  spawn_yaw_range: 0.0
  flipper_material_friction: 6.0
  wheel_material_friction: 4.0
  body_material_friction: 0.1
  terrain_static_friction: 1.2
  terrain_dynamic_friction: 0.9
  shock_fail_limit: null
  module_cfg_overrides:
    rear_flipper_shaping: false
    lateral_band_m: null
    paper_contact_semantics: true
