name: hfc_marv_asym
comment: >-
  HFC (Azayev & Zimmermann 2022, "Autonomous State-Based Flipper Control for Articulated
  Tracked Robots in Urban Environments") flipper policy, reusing marv_asym_limits.yaml's
  robot/terrain/reward parameters. The paper trains its state-transition classifier via
  imitation learning from human demonstrations; we have no such demonstrations in this
  automated pipeline, so this config instead trains the pose-selection Q-network via
  reward-driven D3QN (train_hfc.py) over the paper's 7 named poses (NEUTRAL,
  ASCENDING_FRONT, UP_STAIRS, ASCENDING_REAR, DESCENDING_FRONT, DOWN_STAIRS,
  DESCENDING_REAR — Fig. 1), each resolving to a fixed synced front/rear flipper-angle
  template (see rl_modules/hfc/hfc_policy.py). Requires sync_flipper_control: true and
  flipper_control_mode: position below.
use_wandb: true
use_tensorboard: false
seed: 42
device: cuda
training_dtype: ${dtype:float32}
num_robots: 1024
task: Ftr-Crossing-Direct-v0
terrain: pan_symmetric
total_frames: ${mul:5242880,14}
time_steps_per_batch: 128
eval_and_save_every: 8
eval_repeats: 2
eval_repeats_after_training: 20
max_grad_norm: 0.697298401413678
clip_grad_norm_p: 2

# ---- Off-policy replay + optimisation ----
replay_buffer_capacity: 2000000   # transitions kept, persists across iterations (unlike PPO's on-policy buffer)
min_replay_size: 131072           # ~1 iteration (time_steps_per_batch * num_robots) before updates start
batch_size: 8192
updates_per_batch: 64             # gradient steps performed per collected iteration
gamma: 0.995
target_update_interval: 1000      # gradient steps between hard target-network syncs

# ---- Epsilon-greedy exploration schedule (linear decay) ----
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_iters: null   # null = decay over the full run

optimizer: ${cls:torch.optim.AdamW}
optimizer_opts:
  lr: 0.001
  weight_decay: 0.0001
scheduler: ${cls:torch.optim.lr_scheduler.LinearLR}
scheduler_opts:
  start_factor: 1.0
  end_factor: 0.8
  total_iters: ${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots}}}

data_collector_opts:
  split_trajs: false

# HFCPolicy kwargs — track_vel is the constant forward speed driving the tracks (as with
# atd3qn/icmd3qn, an external operator/planner is assumed to drive the tracks, not the
# pose-selection network). hm_hidden/hm_out/fusion_hidden must match ftr_obs_encoder_opts
# below (same architecture, two separate instantiation points). front_up_deg/front_down_deg/
# back_up_deg/back_down_deg MUST match env_cfg_overrides.marv_flipper_*_deg below — the
# policy has no env reference, so it needs these duplicated to compute each pose's target
# angle correctly (see hfc_policy.py's docstring).
policy_opts:
  track_vel: 0.5
  hm_hidden: 32
  hm_out: 4
  fusion_hidden: 16
  front_up_deg: 90.0
  front_down_deg: 80.0
  back_up_deg: 90.0
  back_down_deg: 80.0

# Observation encoder opts for HFCObservation.get_encoder() (18-D input: 15 terrain + 3 state)
ftr_obs_encoder_opts:
  hm_hidden: 32
  hm_out: 4
  fusion_hidden: 16

vecnorm_opts:
  decay: 0.99
  eps: 0.0001
vecnorm_on_reward: true
extra_env_transforms: []

# Cold start — no warm-start policy available for this architecture yet.
policy_weights_path: null
vecnorm_weights_path: null

robot_max_linear_velocity: 10.0
robot_max_angular_velocity: 720.0
physx_gpu_heap_capacity: 2147483648
physx_gpu_temp_buffer_capacity: 1073741824
physx_gpu_max_num_partitions: 8
solver_position_iterations: 5
solver_velocity_iterations: 1
max_depenetration_velocity: 0.12354395702544713
sim_dt: 0.005
decimation: 20

env_cfg_overrides:
  # Routes FtrEnv's observations/rewards through HFCModule (rl_modules/registry.py)
  # instead of the default marv_rl module — required for the 18-D obs this policy expects.
  module_name: hfc
  # Synced front/rear flipper pairs, matching the reference repo's own FLIPPERS_<STATE>
  # templates (front-left == front-right, rear-left == rear-right in every template).
  sync_flipper_control: true
  # Absolute positional control: HFCPolicy outputs each pose's precomputed target directly
  # (no integration/decimation, unlike atd3qn/icmd3qn's incremental CW/hold/CCW actions) —
  # required so a selected pose's target angle is reached in a single control step.
  flipper_control_mode: position

  robot_type: marv
  goal_reached_reward: 2
  failed_reward: -2
  timeout_penalty: -2
  # HFCModule always computes both pitch_penalty and movement_penalty (their
  # magnitudes/thresholds come from rl_modules/hfc/hfc_module.yaml) — no enable-flags
  # needed here.
  shock_scale: 4
  # Asymmetric per-direction MARV flipper limits (degrees) — MUST match policy_opts'
  # front_up_deg/front_down_deg/back_up_deg/back_down_deg above.
  # Front: up = negative angle, down = positive angle.
  # Rear:  up = positive angle, down = negative angle.
  marv_flipper_front_up_deg: 90.0
  marv_flipper_front_down_deg: 80.0
  marv_flipper_back_up_deg: 90.0
  marv_flipper_back_down_deg: 80.0
  spawn_yaw_range: 0.0
  flipper_material_friction: 3.0
  wheel_material_friction: 6.0
  terrain_static_friction: 0.9
  terrain_dynamic_friction: 0.7
  shock_fail_limit: null
