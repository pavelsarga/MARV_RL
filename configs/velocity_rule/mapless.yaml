# default.yaml without a map: only the reactive criteria (tilt, shake, flippers, turning) act.
# They are stronger here, so their compounded reduction roughly matches default's with the map rules:
# +0.3 on tilt / flippers, +0.2 on shake, and shake held at its peak for a moment (it is the only
# roughness signal left, and it only fires once the robot is already on it). Pitch stays at default's
# 0.5: counted like roll, every 20-38 deg climb read as danger and the robot crawled up the hills.
extends: default.yaml
predictive: false
criteria:
  tilt:     {weight: 0.7}
  shake:    {weight: 0.6, hold_s: 0.25}
  flippers: {weight: 0.5}
