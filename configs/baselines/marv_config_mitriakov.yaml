name: mitriakov_marv
comment: >-
  Mitriakov et al. 2021, "Reinforcement Learning Based, Staircase Negotiation Learning:
  Simulation and Transfer to Reality for Articulated Tracked Robots" (IEEE RA Magazine),
  3-DoF/no-arm variant (matching the paper's Absolem robot task, not Jaguar+arm — see
  the user's notes: "uses 2DOF robotic arm ... we won't"). Trained with PPO via the
  existing train_ftr.py (no dedicated trainer script needed) using MitriakovPolicyConfig
  (rl_modules/mitriakov/mitriakov_policy.py), a self-contained actor/critic MLP matching
  the paper's Fig. 1 architecture (Dense->64->tanh->64->tanh->Dense). Unlike the paper
  (which trains separate ascent/descent policies, Table 2's *-COG vs *-Ang variants),
  the "mitriakov_stairs" terrain mixes both ascending and descending tiles across envs
  (stairs_ascent_descent, alternating by tile repeat) — MitriakovModule.
  get_reward_components() picks Eq. 5's cog_penalty vs Eq. 6's pitch_velocity_penalty
  PER ENV by detected climb direction, training a single policy on both directions at
  once. The asymmetric flipper angle limits are ALSO per-env now: env_cfg_overrides'
  marv_flipper_*_deg below is a single, looser env-wide bound (the outer envelope, same
  for every env), while policy_opts' mitriakov_limit_front_deg/mitriakov_limit_rear_deg
  (rl_modules/mitriakov/mitriakov_policy.py's MitriakovFlipperBounds) is a tighter
  per-env sub-range applied only for the direction the paper actually restricts (rear
  during ascent, front during descent) — "marv can be larger than mitriakov".
use_wandb: true
use_tensorboard: false
seed: 42
device: cuda
training_dtype: ${dtype:float32}
num_robots: 1024
task: Ftr-Crossing-Direct-v0
# Two parallel staircase lanes, one per Table 3 size: 5-step/0.195m-rise/0.275m-tread
# ("Big") and 3-step/0.17m-rise/0.305m-tread ("Small"), generated via
# src/FTR-Bench-terrain-gen/terrain_config_mitriakov_stairs.yaml — matches
# rl_modules/mitriakov/mitriakov_module.yaml's big_/small_*_step_edge_offsets_m/heights_m.
terrain: mitriakov_stairs
total_frames: ${mul:5242880,4} # per pa
time_steps_per_batch: 128
epochs_per_batch: 5
frames_per_sub_batch: 4096
eval_and_save_every: 10
eval_repeats: 2
eval_repeats_after_training: 20
max_grad_norm: 0.7
clip_grad_norm_p: 2

optimizer: ${cls:torch.optim.AdamW}
optimizer_opts: {}
scheduler: ${cls:torch.optim.lr_scheduler.LinearLR}
scheduler_opts:
  start_factor: 1.0
  end_factor: 0.8
  total_iters: ${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots}}}

gae_opts:
  gamma: 0.995
  lmbda: 0.95
  average_gae: false
  skip_existing: false
ppo_opts:
  clip_epsilon: 0.2
  entropy_bonus: true
  entropy_coef: 0.01
  critic_coef: 1.0
  loss_critic_type: smooth_l1
  normalize_advantage: true
  separate_losses: false

data_collector_opts:
  split_trajs: false
  compile_policy: false
  exploration_type: RANDOM

# MitriakovPolicyConfig (mitriakov_policy.py) — self-contained, NOT the generic
# MLPPolicyConfig (see that file's docstring for why: FtrTorchRLEnv always writes the
# observation under the fixed OBS_KEY, not per-Observation-class names, which would
# silently break MLPPolicyConfig's EncoderCombiner for any non-marv_rl module).
policy_config: ${cls:rl_modules.mitriakov.mitriakov_policy.MitriakovPolicyConfig}
policy_opts:
  hidden_dim: 64   # Fig. 1's two 64-unit tanh hidden layers, both actor and critic
  actor_optimizer_opts: {lr: 0.0003}
  value_optimizer_opts: {lr: 0.001}
  # Outer bound MitriakovFlipperBounds maps [-1,1] onto — must match
  # env_cfg_overrides.marv_flipper_*_deg below exactly (mitriakov_policy.py's
  # MitriakovPolicyConfig docstring).
  front_up_deg: 90.0
  front_down_deg: 90.0
  back_up_deg: 90.0
  back_down_deg: 90.0
  # Tighter inner constraint: rear during ascent, front during descent, selected per env
  # from the is_ascending observation feature. The paper's own range is psi_s in
  # [-pi/4, 0] — NEVER raise the trailing flipper above neutral (tip-over safety: "overly
  # raising the rear flippers while ascending... combined with acceleration, can produce
  # a tip-over"), but it may dip down to -45 deg. mitriakov_limit_*_deg (the up edge) is
  # therefore kept near 0, matching the paper exactly, with a small 5 deg control margin
  # rather than the paper's hard 0 — NOT raised to 75, which would re-permit the
  # tip-over-prone raising motion the paper forbids. mitriakov_trail_down_*_deg (45 deg)
  # matches the paper's -pi/4 down allowance; MARV has no continuous main track (base_link
  # is a bare, low-friction hull — see marv.py) so the trailing flipper's wheels are its
  # only ground contact during that phase, making this down-side reach load-bearing here
  # in a way it wasn't for the paper's tracked chassis (see mitriakov_policy.py's
  # MitriakovFlipperBounds docstring).
  mitriakov_limit_front_deg: 5.0
  mitriakov_limit_rear_deg: 5.0
  mitriakov_trail_down_front_deg: 45.0
  mitriakov_trail_down_rear_deg: 45.0

# MitriakovEncoder takes no meaningful options (identity passthrough — see
# mitriakov_observation.py).
ftr_obs_encoder_opts: {}

vecnorm_opts:
  decay: 0.99
  eps: 0.0001
# Off: none of the reproduced papers use reward normalisation, and every non-marv_rl
# observation class already sets supports_vecnorm = False, so VecNorm reduces to a no-op
# here (verified: VecNorm with empty in_keys passes the tensordict through unchanged).
# Reward scale is load-bearing for these methods' own literal reward constants.
vecnorm_on_reward: false
extra_env_transforms: []

policy_weights_path: null
vecnorm_weights_path: null

robot_max_linear_velocity: 10.0
robot_max_angular_velocity: 720.0
physx_gpu_heap_capacity: 2147483648
physx_gpu_temp_buffer_capacity: 1073741824
physx_gpu_max_num_partitions: 8
solver_position_iterations: 5
solver_velocity_iterations: 1
max_depenetration_velocity: 0.12354395702544713
sim_dt: 0.005
decimation: 20

env_cfg_overrides:
  # Constant forward velocity (ftr_env.py's _apply_action substitutes this for
  # actions[:, 0] at the physics layer regardless of what the policy outputs) — same
  # mechanism/value atd3qn/icmd3qn/hfc already use. Added after eval --print_actions on a
  # trained checkpoint showed a[0] (track_v) had converged to a deterministic step-to-step
  # sign-flipping oscillation (mean ~0, no sustained direction) while a[2]/a[3] (front/
  # rear) locked into a fixed extreme posture within ~30 steps — the policy was rocking in
  # place with flipper torque pinned near its effort limit rather than driving forward.
  # Fixing v removes that failure mode entirely and leaves the policy to learn only the
  # flipper angles, which is what's actually load-bearing for the staircase task.
  fixed_forward_vel: 0.6
  # Routes FtrEnv's observations/rewards through MitriakovModule (rl_modules/registry.py).
  module_name: mitriakov
  # Front/rear flipper pairs, matching the paper's psi^front/psi^rear (no per-side
  # independent control — the paper's own 3-DoF task doesn't have it either).
  sync_flipper_control: true
  # Absolute positional control: the paper's action is an absolute flipper-angle target
  # (not an increment/velocity) — same mode hfc uses, see ftr_env.py's flipper_control_mode.
  flipper_control_mode: position

  robot_type: marv
  # No separate terminal bonus for reaching the goal: MitriakovModule's traversal_reward
  # (Eq. 3) already sums to ~1.0 over a full successful traversal on its own, matching
  # the paper's R^tr(tau) exactly — adding a nonzero goal_reached_reward here would
  # double-count success.
  goal_reached_reward: 0.0
  # Matches Eq. 5/6's "-1, if tip over" exactly.
  failed_reward: -1.0
  timeout_penalty: 0.0
  # pi/2, matching the paper's exact tip-over criterion ("loses stability and tips over,
  # which happens when its pitch reaches pi/2") — CrossingEnv's own default
  # (rollover_threshold_deg: 80.0) is a close but inexact stand-in.
  rollover_threshold_deg: 90.0
  shock_scale: 4
  shock_fail_limit: null

  # Outer/looser flipper envelope (degrees) — same for every env regardless of climb
  # direction. The paper's actual asymmetric per-direction limits (rear in [-pi/4, 0]
  # during ascent, front in [-pi/4, 0] during descent) are enforced as the TIGHTER inner
  # constraint in policy_opts (mitriakov_limit_front_deg/mitriakov_limit_rear_deg), applied
  # per env via MitriakovFlipperBounds (mitriakov_policy.py) using the same is_ascending
  # signal as the reward's direction selection above — "marv" is just the outer bound
  # mitriakov's tighter range can never exceed, not itself direction-aware.
  marv_flipper_front_up_deg: 90.0
  marv_flipper_front_down_deg: 90.0
  marv_flipper_back_up_deg: 90.0
  marv_flipper_back_down_deg: 90.0
  # Clearance REWARD (formula ported from marv_config_marv_rl.yaml's clearance_penalty,
  # sign flipped — see mitriakov_module.py's clearance_reward comment for why: without a
  # continuous main track, MARV can only clear a stair tread by the flippers actively
  # lifting/bridging it, so rewarding clearance pushes toward that instead of a low,
  # belly-scraping posture). Coefficient is NOT reused verbatim from marv_rl — marv_rl's
  # reward lives on an O(1-100) scale (shaping_coef: 72.5, goal_reached_reward: 129.5), so
  # its clearance_coef: 0.2997 (max 0.3/step, sigmoid saturates at 1) is a minor term
  # there. mitriakov's traversal_reward instead sums to 1.0 over the WHOLE episode (Eq. 3)
  # and direction_penalty uses K_D=K_W=0.5 against physical quantities that are typically
  # 0.05-0.2 (COG deviation in meters / pitch velocity in rad/s), i.e. per-step magnitudes
  # around 0.01-0.1 — reusing marv_rl's 0.2997 verbatim would swamp both (max 0.3/step,
  # every step, vs ~0.003/step traversal reward). Scaled down to sit in the same per-step
  # range as K_D/K_W's typical contribution instead. Not in the paper (Eq. 5/6 only cover
  # COG deviation and pitch velocity, both well-defined regardless of a main track); added
  # because MARV has no continuous main-track hull-to-ground contact to fall back on
  # (mitriakov_module.py's get_reward_components() docstring / clearance_reward comment).
  clearance_coef: 0.1
  spawn_yaw_range: 0.0
  flipper_material_friction: 6.0
  wheel_material_friction: 4.0
  body_material_friction: 0.1
  terrain_static_friction: 1.2
  terrain_dynamic_friction: 0.9
