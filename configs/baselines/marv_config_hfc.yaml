name: hfc_azayev_zimmermann
comment: >-
  Hybrid Flipper Controller (Azayev & Zimmermann 2022, "Autonomous State-Based Flipper
  Control for Articulated Tracked Robots in Urban Environments") — full re-implementation
  of all three of the paper's action components (rl_modules/hfc/hfc_policy.py): flipper
  template position (a_temp, Fig. 1's 7 named poses), body roll stabilization (a_stab,
  Eq. 7, PD on roll/roll-rate, kp/kd learnable — the paper gives no numeric value), and
  escape maneuvers (a_em, Eq. 8, stagnation-driven per-pose front/rear modifiers —
  learnable, warm-started at the paper's one given numeric example for ASCENDING_REAR).
  The state classifier is the paper's own best-performing variant (SDSM, Eq. 6 — 7
  per-state transition networks blended by a persistent per-env belief). One deliberate
  departure from the paper: the paper trains its classifier via imitation learning from
  human demonstrations we don't have (Eq. 2); per explicit user decision, this config
  instead trains the ENTIRE controller (classifier + kp/kd + escape magnitudes) via PPO
  (train_ftr.py — NOT train_hfc.py, which is deleted), using marv_rl's own reward
  function as the training signal (env_cfg_overrides below are copied verbatim from
  marv_config_marv_rl.yaml; hfc_module.py's get_reward_components() is an intentional
  line-for-line copy of marv_rl_module.py's). Requires sync_flipper_control: false (4
  independent flippers — Eq. 7/8 both act asymmetrically on left/right or front/rear
  flippers, impossible with synced pairs).
use_wandb: true
use_tensorboard: false
seed: 42
device: cuda
training_dtype: ${dtype:float32}
num_robots: 1024
task: Ftr-Crossing-Direct-v0
terrain: custom_mixed
total_frames: ${mul:5242880,14}
time_steps_per_batch: 128
epochs_per_batch: 5
frames_per_sub_batch: 4096
eval_and_save_every: 8
eval_repeats: 2
eval_repeats_after_training: 20
max_grad_norm: 0.697298401413678
clip_grad_norm_p: 2

optimizer: ${cls:torch.optim.AdamW}
optimizer_opts: {}
scheduler: ${cls:torch.optim.lr_scheduler.LinearLR}
scheduler_opts:
  start_factor: 1.0
  end_factor: 0.8
  total_iters: ${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots}}}
step_penalty_scheduler:
  type: linear
  start_factor: 0.5
  end_factor: 1.0
  total_iters: ${intdiv:${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots}}},1}
action_bonus_coef_scheduler:
  type: linear
  start_factor: 1.0
  end_factor: 1.0
  total_iters: ${intdiv:${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots}}},1}

gae_opts:
  gamma: 0.9956304305372804
  lmbda: 0.97982059570308
  average_gae: false
  skip_existing: false
ppo_opts:
  clip_epsilon: 0.2
  entropy_bonus: true
  entropy_coef: 0.012062144919804764
  critic_coef: 1.0
  loss_critic_type: smooth_l1
  normalize_advantage: true
  separate_losses: false

data_collector_opts:
  split_trajs: false
  compile_policy: false
  exploration_type: RANDOM

# Self-contained PPO actor/critic (hfc_policy.py) — SDSM classifier + Eq. 7/8/9 decode,
# NOT the generic MLPPolicyConfig path (same reasoning as mitriakov_policy.py: this
# module's action mean is a physically-structured function, not an arbitrary MLP output).
policy_config: ${cls:rl_modules.hfc.hfc_policy.HFCPolicyConfig}
policy_opts:
  # Must match env_cfg_overrides.fixed_forward_vel below.
  track_vel: 0.4
  init_log_std: -1.0
  # Must match env_cfg_overrides.marv_flipper_*_deg below.
  front_up_deg: 60.0
  front_down_deg: 80.0
  back_up_deg: 60.0
  back_down_deg: 80.0
  hm_hidden: 32
  hm_out: 4
  fusion_hidden: 32
  head_hidden: 16
  value_hidden: 32
  actor_optimizer_opts:
    lr: 0.0005029432013813284
    weight_decay: 0.0001
  value_optimizer_opts:
    lr: 0.001699179381874355
    weight_decay: 0.0001

# HFCObservation has no encoder options (HFCPolicyConfig reads OBS_KEY directly, bypassing
# the generic EncoderCombiner path — see hfc_observation.py's get_encoder() docstring).
ftr_obs_encoder_opts: {}

vecnorm_opts:
  decay: 0.99
  eps: 0.0001
# Off: none of the reproduced papers use reward normalisation, and every non-marv_rl
# observation class already sets supports_vecnorm = False, so VecNorm reduces to a no-op
# here (verified: VecNorm with empty in_keys passes the tensordict through unchanged).
# Reward scale is load-bearing for these methods' own literal reward constants.
vecnorm_on_reward: false
extra_env_transforms: []

# Cold start — no prior HFC checkpoint to warm-start from (architecture is new this run).
policy_weights_path: null
vecnorm_weights_path: null

robot_max_linear_velocity: 10.0
robot_max_angular_velocity: 720.0
physx_gpu_heap_capacity: 2147483648
physx_gpu_temp_buffer_capacity: 1073741824
physx_gpu_max_num_partitions: 8
solver_position_iterations: 5
solver_velocity_iterations: 1
max_depenetration_velocity: 0.12354395702544713
sim_dt: 0.005
decimation: 20

env_cfg_overrides:
  # Routes FtrEnv's observations through HFCObservation and reward through HFCModule
  # (which mirrors MarvRLModule's reward exactly — see hfc_module.py's docstring).
  module_name: hfc
  # 4 independent flippers — required for Eq. 7 (left vs right) / Eq. 8 (front vs rear).
  sync_flipper_control: false
  # Absolute positional control: the paper's action is an absolute flipper-angle target.
  flipper_control_mode: position
  # The paper's "robot automatically driven forward by a constant speed" — HFCActorNet
  # always emits this same constant for v itself (see hfc_policy.py), this override just
  # guarantees it regardless.
  fixed_forward_vel: 0.6

  robot_type: marv
  goal_reached_reward: 129.53813225921667
  failed_reward: -29.94922004490214
  shaping_coef: 72.50368190480287
  shaping_gamma: ${gae_opts.gamma}
  step_penalty: -0.11897778110727907
  action_bonus_coef: 16.29043388277351
  lin_action_ratio: 0.4006406952421414
  flipper_action_bonus_coef: 3.4183030312529787
  timeout_penalty: null
  joint_vel_variance_coef: null
  joint_angle_variance_coef: 0.26749598035386796
  joint_ang_from_flat_coef: 0.33507830419385
  flipper_contact_coef: null
  roll_coef: 2.596473423161265
  roll_rate_coef: 3.560503349946966
  pitch_coef: 2.3498290548331044
  pitch_rate_coef: 2.8641644032447258
  clearance_coef: 0.2997426405166963
  shock_coef: 15
  shock_scale: 4
  # Asymmetric per-direction MARV flipper limits (degrees) — must match policy_opts above.
  marv_flipper_front_up_deg: 60.0
  marv_flipper_front_down_deg: 80.0
  marv_flipper_back_up_deg: 60.0
  marv_flipper_back_down_deg: 80.0
  spawn_yaw_range: 0.0
  flipper_material_friction: 6.0
  wheel_material_friction: 4.0
  body_material_friction: 0.1
  terrain_static_friction: 1.2
  terrain_dynamic_friction: 0.9
  shock_fail_limit: null

log_raw_accel: false
log_raw_accel_interval: 50
