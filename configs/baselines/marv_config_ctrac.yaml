name: ctrac_pan2025
comment: >-
  C-TRAC (Pan et al. 2025, "C-TRAC: Terrain-Adaptive Control for Articulated Tracked
  Robots via Contact-Aware Reinforcement Learning") — Stage II, joint asymmetric SAC +
  C-VAE training (rl_modules/ctrac/{ctrac_module,ctrac_observation,ctrac_contact,
  ctrac_cvae,ctrac_policy}.py, src/flipper_training/marv_rl_training/training/train_sac.py).
  Ground-truth per-flipper contact points/existence come from a real IsaacLab
  ContactSensor + wheel-radius geometric projection (ftr_env.py's _setup_scene, gated on
  module_name: ctrac — see ctrac_contact.py). Two deliberate departures from the paper,
  both explicit user decisions: (1) terrain is this project's existing custom_mixed asset,
  not the paper's per-episode procedural stair/stepfield/terrace/ramp curriculum; (2) the
  C-VAE's Stage I pretraining dataset (marv_config_ctrac_cvae_pretrain.yaml) is collected
  by rolling out this project's already-trained marv_rl policy through this CTRAC-configured
  env (collect_ctrac_dataset.py), not the paper's own from-scratch terrain-specific
  policies (unavailable here) — reasoning: an untrained/barely-trained policy can't cross
  most obstacles, starving the dataset of exactly the contact-pattern diversity the C-VAE
  needs. cvae_weights_path below warm-starts (not freezes) the C-VAE from that Stage I
  checkpoint; it keeps training jointly through Stage II via its own optimizer with a
  RISING learning-rate schedule (scheduler/scheduler_opts below — the inverse of every
  other schedule in this project), deliberately blunting its influence early while SAC's
  rollout distribution is still far from the Stage I marv_rl-driven demonstrations, then
  ramping up as training converges closer to it.
use_wandb: true
use_tensorboard: false
seed: 42
device: cuda
training_dtype: ${dtype:float32}
num_robots: 512
task: Ftr-Crossing-Direct-v0
terrain: custom_mixed
total_frames: ${mul:5242880,10}
time_steps_per_batch: 128

# ---- Off-policy replay + optimisation ----
# Lowered from 2,000,000 (copied from the D3QN configs without reconsidering CTRAC's much
# heavier per-transition footprint — see train_sac.py's replay-buffer comment; the
# original value OOM-killed a real run). Now disk-backed (LazyMemmapStorage) so this
# mainly controls disk usage / replay staleness, not RAM — 500,000 x ~17.9 KB/transition
# =~ 9 GB on disk.
replay_buffer_capacity: 500000
min_replay_size: 65536
batch_size: 256                    # Table (paper): batch_size 256
updates_per_batch: 32
gamma: 0.99                        # paper Table: discount factor 0.99
tau: 0.01                          # paper Table: target network update rate 0.01

# ---- SAC entropy: paper says "entropy coefficient (1.5)" and states the implementation
# "leverages the SAC framework from the Stable-Baselines3 RL library". In SB3's SAC,
# ent_coef defaults to "auto" (auto-tuned, initial value 1.0) and an initial value is
# spelled "auto_1.5"; a bare float means a FIXED coefficient. 1.5 is a natural tweak of
# SB3's 1.0 auto-init and an unusual fixed value, so "entropy coefficient (1.5)" reads as
# the auto-tuning initial value — which is what alpha_init + fixed_alpha: false gives.
#
# Reading it as fixed (the original setting here) produced a policy that never left the
# max-entropy prior: after 19M frames the actor's loc was ~0.05 and its scale ~0.92, i.e.
# near-uniform over the tanh range, so actions averaged to ~0 and the robot thrashed in
# place (action/v_mean ~0.05 while lin_vel_mean was 0.31 — motion without displacement,
# dist_to_goal 7.03 -> 6.55 over the whole run). With alpha pinned at 1.5, SAC's Boltzmann
# optimum pi ~ exp(Q/alpha) is near-uniform unless Q varies by more than ~1.5 across
# actions, and this reward's per-step action-dependent Q spread is far smaller than that.
# Auto-tuning drives alpha down until the policy hits target_entropy instead.
alpha_init: 1.5
fixed_alpha: false
# MUST be explicit: "auto" is broken in this torchrl version. SACLoss.target_entropy
# computes -action_spec.shape[len(container_shape):].numel() after wrapping the spec in a
# Composite, so it measures the *container's* shape, not the action's — it returns -1.0 for
# both a bare Bounded(6,) and a Composite(action=(512,6)) (both verified). A target of -1.0
# for a 6-D action is barely more deterministic than the max-entropy prior we're trying to
# escape, so leaving this on "auto" would have silently reproduced the same failure.
#
# -5.0 = SB3's literal -dim(action_space) rule for this 6-D action, restored after the
# heightmap fix (see ctrac_module.py's _crop_and_pad). It was loosened to -3.0 on the
# evidence below, but that evidence was gathered while the policy could not see forward.
#
# What was measured at -5.0 (run train_ctrac_11311704, 49M frames): final policy entropy
# H = -3.485 nats. Since alpha's gradient is -(log_pi + target_entropy), alpha only rises
# when H < target; with H = -3.485 > -5.0 the target was unreachable from above, so alpha
# fell monotonically 1.486 -> 0.0065 and entropy regularisation switched itself off. The
# actor then optimised Q alone and drove |loc| to 0.92, deep into tanh saturation.
#
# Why that no longer justifies -3.0: _crop_and_pad was sampling the MIRROR of the paper's
# heightmap ranges, so the actor's local map showed 0.4-1.0 m BEHIND the robot instead of
# ahead. Per-lane success then came out near-identical (r = 0.94-0.996) across runs at
# -5.0 AND at -3.0, plateauing at ~0.13 with every "climb up" lane at exactly 0.000 — a
# ceiling set by missing forward vision, not by exploration. H = -3.485 is what a
# forward-blind policy converged to; a policy that can see the obstacle it is about to
# mount has no reason to settle at the same entropy. Keeping -3.0 would change two
# variables at once and make the heightmap fix impossible to attribute.
#
# So: back to the literal SB3 value for the first post-fix run. Note the env's action is
# 6-D while Eq. 3's is 5-D — ctrac_policy.py pins the unused w (yaw-rate) dim at loc=0,
# scale=exp(-4), contributing a constant ~-2.58 nats, so the 5 real dims settle near -0.48
# each rather than SB3's nominal -1.0.
#
# If alpha again decays monotonically toward 0 (watch train/alpha in the first ~5M frames),
# the target is still unreachable from above and -3.0 is the right correction — but decide
# that from a run where the policy can actually see ahead.
target_entropy: -5.0
alpha_optimizer_opts:
  lr: 0.0003
loss_function: smooth_l1

# ---- C-VAE alternating update (Fig. 2: "1 SAC iteration : 5 C-VAE refinement iterations") ----
cvae_updates_per_sac_step: 5
cvae_vae_beta: 1.0                 # paper Table: KL divergence weight 1.0
cvae_prob_weight: 1.0
cvae_est_weight: 1.0
cvae_geo_weight: 1.0
cvae_max_reach: 0.8

eval_and_save_every: 8
eval_repeats: 2
eval_repeats_after_training: 20
max_grad_norm: 0.5                 # paper Table: gradient clipping threshold 0.5
clip_grad_norm_p: 2

optimizer: ${cls:torch.optim.Adam}
optimizer_opts:
  lr: 0.0003                       # paper Table: Adam lr 3e-4
# Rising schedule for the C-VAE's own optimizer ONLY (train_sac.py's cvae_scheduler) — actor/
# qvalue optimizers use a flat lr (optimizer_opts above), matching the paper's single Adam
# lr with no schedule mentioned. LinearLR with start_factor < end_factor deliberately ramps
# UP rather than down (see the comment block above / this config's top-level comment).
scheduler: ${cls:torch.optim.lr_scheduler.LinearLR}
scheduler_opts:
  start_factor: 0.1
  end_factor: 1.0
  total_iters: ${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots}}}

data_collector_opts:
  split_trajs: false

# CTRACPolicyConfig kwargs (rl_modules/ctrac/ctrac_policy.py).
policy_opts:
  actor_optimizer_opts:
    lr: 0.0003
  qvalue_optimizer_opts:
    lr: 0.0003
  cvae_optimizer_opts:
    lr: 0.0001                     # low starting point — scaled up by the rising schedule above
  history_len: 8
  latent_dim: 32
  actor_hidden: [512, 128]         # paper Fig. 2 actor sizes
  qvalue_hidden: [512, 256, 128]   # paper Fig. 2 critic sizes
  cvae_encoder_hidden: [512, 256, 128]
  cvae_decoder_hidden: [128, 256, 128]
  w_log_std: -4.0
  # Stage I checkpoint from pretrain_ctrac_cvae.py (marv_config_ctrac_cvae_pretrain.yaml's
  # output_path). null = cold start (matches "C-TRAC w/o Pretrained", the paper's own
  # ablation shape) — set this once Stage I has actually run.
  cvae_weights_path:  experiments/baselines/ctrac/ctrac_dataset/ctrac_cvae_stage1.pth

ftr_obs_encoder_opts: {}

vecnorm_opts:
  decay: 0.99
  eps: 0.0001
# MUST stay false for SAC with a fixed entropy coefficient. The paper's alpha (1.5) is
# calibrated against its RAW reward scale (per-step ~-2, terminal +-150/-225); SAC's actor
# loss is alpha*log_pi - Q, so normalising the reward rescales Q while alpha stays fixed and
# the entropy term takes over. Observed in run train_ctrac_11305386: normalised reward came
# out ~-0.005 vs a raw ~-1.8, i.e. ~360x smaller than alpha assumes -> loss_actor diverged
# monotonically (-2 -> -84 over 29M frames) as the policy maximised entropy unopposed, std
# blew up, and the deterministic-eval mean action collapsed to ~0 (v_mean ~0.008): the robot
# standing still. The paper uses SB3 SAC on unnormalised rewards; this flag is inherited from
# the PPO trainer, where advantage normalisation makes reward scale far less critical.
vecnorm_on_reward: false
extra_env_transforms: []

policy_weights_path: null
vecnorm_weights_path: null

robot_max_linear_velocity: 10.0
robot_max_angular_velocity: 720.0
physx_gpu_heap_capacity: 2147483648
physx_gpu_temp_buffer_capacity: 1073741824
physx_gpu_max_num_partitions: 8
solver_position_iterations: 5
solver_velocity_iterations: 1
max_depenetration_velocity: 0.12354395702544713
sim_dt: 0.005
decimation: 20

env_cfg_overrides:
  # Routes FtrEnv's observations/reward through CTRACModule and attaches the ContactSensor
  # (ftr_env.py's _setup_scene, gated on this) — see rl_modules/registry.py.
  module_name: ctrac
  # 4 independent flippers — Eq. 3's action is per-flipper.
  sync_flipper_control: false
  # "velocity" (the env's default) integrates a continuous, magnitude-proportional
  # per-step delta onto the current flipper angle — exactly the paper's continuous
  # delta-rotation-angle action (Eq. 3), unlike atd3qn/icmd3qn's discrete ±-only
  # "increment" mode. No fixed_forward_vel override either: unlike hfc/creps/atd3qn/
  # icmd3qn, the paper's action genuinely includes desired velocity v_t as a learned
  # output (Eq. 3), not a fixed constant.
  flipper_control_mode: velocity

  robot_type: marv
  goal_reached_reward: 150     # Eq. 8
  failed_reward: -150          # Eq. 8 (tipover)
  timeout_penalty: -225        # Eq. 8 (t >= 200)
  step_penalty: 0.0

  # Asymmetric per-direction MARV flipper limits (degrees) — same values as hfc/creps.
  marv_flipper_front_up_deg: 60.0
  marv_flipper_front_down_deg: 80.0
  marv_flipper_back_up_deg: 60.0
  marv_flipper_back_down_deg: 80.0
  spawn_yaw_range: 0.0
  flipper_material_friction: 6.0
  wheel_material_friction: 4.0
  body_material_friction: 0.1
  terrain_static_friction: 1.2
  terrain_dynamic_friction: 0.9
  shock_fail_limit: null
