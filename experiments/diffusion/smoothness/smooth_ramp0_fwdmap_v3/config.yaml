name: marv_diffusion_p1_smooth_ramp0_fwdmap_v3
comment: 'Rerun with smooth_coef starting at 0 (all weights kept): the 0.05 start
  made smooth_ramp learn ~4x slower than fwdscale_cold (penalty -2.9/step vs +2.1
  shaping), and the first run died at its first eval on a tracker inference-mode bug
  (fixed). smooth_ramp_fwdmap on mixed_v3_straight (ten lowered rows, +-0.5 m position
  jitter, sampled spacing, two-tier platform: first sharp edge up 56 % / down 39 %
  vs 73 / 23 on v2). Everything else identical to smooth_ramp_fwdmap, so B vs C isolates
  the course.

  smooth_ramp + height map crop shifted 0.25 m forward (1.375 m ahead / 0.875 m behind;
  CrossingEnvCfg.height_map_forward_offset): the policy sees a drop 0.815 m before
  its front flipper tips instead of 0.565 m. Everything else identical to smooth_ramp.

  Motion-smoothness reward replacing TQ (misc/metric_research README, FTR smoothness.py).
  Per-step penalty -smooth_coef * sum_k w_k cost_k over the integrals of squared motion
  derivatives at the physics rate: pitch / roll angular acceleration (temporal; grows
  ~v^3 in front of a terrain change, so it prices speed exactly there), d2z/ds2 and
  d2pitch/ds2 over path length (spatial, speed-independent); speed jerk weight 0 (noise
  in Gazebo). Weights = 1/mean of fwdscale_cold (calibration evals 11800943/44), so
  each channel contributes ~1 per step for a trained policy. smooth_coef starts at
  0.05 and ramps to 0.15 SR-gated (0.15 is what makes slowing down before a descent
  pay against the per-metre step penalty; an untrained policy is 4-20x jerkier, so
  full strength from the start would favour standing still). tq_coef off; the forward-reward
  scale schedule of fwdscale_cold is dropped because 0.15 was sized against the full-strength
  forward rewards. Watch train/smooth_coef, eval/success_rate, smooth/*_descending
  vs smooth/*, and descent/flipper_extension vs descent/flipper_extension_elsewhere.'
