name: atd3qn_marv_flipperonly
comment: >-
  AT-D3QN, MARV-adapted, but with R_contact REMOVED and R_flipper boosted 3x instead.
  Tests whether flipper-angle shaping alone can do the job R_contact currently does --
  keeping the robot down on its tracks rather than balanced on the flipper tips. This arm
  is closer to AT-D3QN's published reward than marv_config_atd3qn.yaml (that paper defines
  no R_contact at all); the deviation here is kappa_flipper, not the term set.
  AT-D3QN (Pan et al. 2023) flipper policy, reusing marv_asym_limits.yaml's
  robot/terrain/reward parameters. Front/rear flipper pairs only (2-DOF,
  9-action discrete space) — requires sync_flipper_control: true below, which
  deviates from marv_asym_limits.yaml's 4-independent-flipper default. If you
  need true per-corner MARV control, the Q-network's action space (currently
  3x3=9) needs extending to 3^4=81 and is out of scope for this config.
use_wandb: true
use_tensorboard: false
seed: 42
device: cuda
training_dtype: ${dtype:float32}
num_robots: 1024
task: Ftr-Crossing-Direct-v0
terrain: pan_symmetric
# Doubled from x6 (31.5M). Neither method had plateaued at 31.5M: AT-D3QN's greedy eval
# was still climbing at +0.065/10M in job 11382142 (0.398 -> 0.667) and ICM-D3QN at
# +0.031/10M in 11381131, so 31.5M measured a floor rather than a converged value.
total_frames: ${mul:5242880,12}
time_steps_per_batch: 128
eval_and_save_every: 8
eval_repeats: 2
eval_repeats_after_training: 20
max_grad_norm: 0.697298401413678
clip_grad_norm_p: 2

# ---- Off-policy replay + optimisation ----
replay_buffer_capacity: 2000000   # transitions kept, persists across iterations (unlike PPO's on-policy buffer)
min_replay_size: 131072           # ~1 iteration (time_steps_per_batch * num_robots) before updates start
batch_size: 8192
updates_per_batch: 64             # gradient steps performed per collected iteration
gamma: 0.995
target_update_interval: 1000      # gradient steps between hard target-network syncs

# ---- Epsilon-greedy exploration schedule (linear decay) ----
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_iters: null   # null = decay over the full run

optimizer: ${cls:torch.optim.AdamW}
optimizer_opts:
  lr: 0.001
  weight_decay: 0.0001
scheduler: ${cls:torch.optim.lr_scheduler.LinearLR}
scheduler_opts:
  start_factor: 1.0
  end_factor: 0.8
  total_iters: ${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots}}}
# No step_penalty_scheduler / action_bonus_coef_scheduler: FtrD3QNTrainer doesn't support
# them, and neither step_penalty nor action_bonus_coef is read by
# ATD3QNModule.get_reward_components() at all.

data_collector_opts:
  split_trajs: false

# ATD3QNPolicy kwargs — track_vel is the constant forward speed driving the tracks
# (the paper assumes an external operator/planner, not the D3QN network, controls this);
# hm_hidden/hm_out/fusion_hidden must match ftr_obs_encoder_opts below (same architecture,
# two separate instantiation points: FtrTorchRLEnv's Observation bookkeeping vs the actual
# training policy).
policy_opts:
  track_vel: 0.6
  hm_hidden: 32
  hm_out: 4
  fusion_hidden: 16

# Observation encoder opts for ATD3QNObservation.get_encoder()
# (18-D input: 15 terrain + 3 state = {theta_f1, theta_f2, theta_R}, Eq. 2)
ftr_obs_encoder_opts:
  hm_hidden: 32
  hm_out: 4
  fusion_hidden: 16

vecnorm_opts:
  decay: 0.99
  eps: 0.0001
# Off: none of the reproduced papers use reward normalisation, and every non-marv_rl
# observation class already sets supports_vecnorm = False, so VecNorm reduces to a no-op
# here (verified: VecNorm with empty in_keys passes the tensordict through unchanged).
# Reward scale is load-bearing for these methods' own literal reward constants.
vecnorm_on_reward: false
extra_env_transforms: []

# Cold start — no warm-start policy available for this architecture yet.
policy_weights_path: null
vecnorm_weights_path: null

robot_max_linear_velocity: 10.0
robot_max_angular_velocity: 720.0
physx_gpu_heap_capacity: 2147483648
physx_gpu_temp_buffer_capacity: 1073741824
physx_gpu_max_num_partitions: 8
solver_position_iterations: 5
solver_velocity_iterations: 1
max_depenetration_velocity: 0.12354395702544713
sim_dt: 0.005
decimation: 20

env_cfg_overrides:
  # Routes FtrEnv's observations/rewards through ATD3QNModule (rl_modules/registry.py)
  # instead of the default marv_rl module — required for the 18-D obs this policy expects.
  module_name: atd3qn
  # 2-DOF front/rear flipper pairs, matching the paper's action space (see comment above).
  sync_flipper_control: true
  # Incremental flipper control: each discrete action {-1, 0, +1} steps the flipper by a
  # fixed ±flipper_angle_increment_deg per control step (matching AT-D3QN's ±π/12 CW/hold/CCW
  # design), integrated onto the current angle and clamped to the asymmetric MARV limits below.
  flipper_control_mode: increment
  flipper_angle_increment_deg: 15.0   # π/12
  # ATD3QNPolicy already always emits this same constant for track_v itself (the paper's
  # action space has no velocity component — see atd3qn_policy.py's docstring); this
  # override is a defense-in-depth backstop, not a behavior change, so it must match
  # policy_opts.track_vel above.
  fixed_forward_vel: 0.6
  robot_type: marv
  goal_reached_reward: 2
  failed_reward: -2
  timeout_penalty: -2
  # ATD3QNModule always computes flipper_penalty and pitch_penalty (Eq. 4 / Eq. 6); their
  # lambda/kappa values and the MARV-morphology switches live in
  # rl_modules/atd3qn/atd3qn_module.yaml, so no enable-flag is needed here. See
  # rl_modules/pan_shared.py for what those switches change and why.
  shock_scale: 4
  # Asymmetric per-direction MARV flipper limits (degrees).
  # Front: up = negative angle, down = positive angle.
  # Rear:  up = positive angle, down = negative angle.
  marv_flipper_front_up_deg: 90.0
  marv_flipper_front_down_deg: 80.0
  marv_flipper_back_up_deg: 90.0
  marv_flipper_back_down_deg: 80.0
  spawn_yaw_range: 0.0
  flipper_material_friction: 10.0
  wheel_material_friction: 8.0
  body_material_friction: 0.1
  terrain_static_friction: 2
  terrain_dynamic_friction: 1.5
  shock_fail_limit: null

  # ---- Flipper-only variant: no R_contact, boosted R_flipper -------------------------
  # Why: R_contact is currently the only term constraining ride height, and it works --
  # job 11382142 (kappa_contact 0.005) held clearance at ~0.09 and reached a 0.606 mean
  # eval, while job 11381130 (no contact, same flipper weight) climbed monotonically to
  # 0.194 and stalled at 0.413. The open question is whether that restoring force has to
  # come from a contact term, or whether R_flipper simply lacked the authority to supply
  # it: theta* is near horizontal on flat ground, so tracking it should already preclude
  # standing on the tips.
  #
  # Sizing the boost. In 11381130 the flipper term was already worth 50% of the terminal
  # reward (-0.99 per 300-step episode against +/-2) at kappa_flipper 0.005 and the policy
  # still sat 69 deg off target, so it was paying ~1.0 to hold that pose. A 2x boost would
  # only make that ~2.0 -- borderline against a +/-2 terminal -- so this uses 3x to make the
  # test decisive rather than ambiguous:
  #     kappa_flipper 0.015 x 300 steps x |R_flipper| = up to 4.5 = 225% of terminal
  #     at the ~0.77 saturation fraction actually observed: ~3.5 = ~173%
  #
  # That is deliberately dominant, and it has a known failure mode: when the dense reward
  # far exceeds the sparse one the policy can optimise posture at the expense of reaching
  # the goal. Watch rew/terminal_bonus -- it went POSITIVE (+0.73/ep) in 11382142, which is
  # the signature of actually succeeding. If it goes sharply negative here while
  # flipper_penalty shrinks, the boost is too large; drop kappa_flipper to 0.010.
  module_cfg_overrides:
    # AT-D3QN's paper has no R_contact — off, as published.
    kappa_contact: 0.0
    # 3x the sibling paper's Table 2 value (0.005), the one deliberate deviation here.
    kappa_flipper: 0.015
