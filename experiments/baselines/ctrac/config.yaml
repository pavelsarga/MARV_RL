name: ctrac_pan2025
comment: 'C-TRAC (Pan et al. 2025, "C-TRAC: Terrain-Adaptive Control for Articulated
  Tracked Robots via Contact-Aware Reinforcement Learning") — Stage II, joint asymmetric
  SAC + C-VAE training (rl_modules/ctrac/{ctrac_module,ctrac_observation,ctrac_contact,
  ctrac_cvae,ctrac_policy}.py, src/flipper_training/marv_rl_training/training/train_sac.py).
  Ground-truth per-flipper contact points/existence come from a real IsaacLab ContactSensor
  + wheel-radius geometric projection (ftr_env.py''s _setup_scene, gated on module_name:
  ctrac — see ctrac_contact.py). Two deliberate departures from the paper, both explicit
  user decisions: (1) terrain is this project''s existing custom_mixed asset, not
  the paper''s per-episode procedural stair/stepfield/terrace/ramp curriculum; (2)
  the C-VAE''s Stage I pretraining dataset (marv_config_ctrac_cvae_pretrain.yaml)
  is collected by rolling out this project''s already-trained marv_rl policy through
  this CTRAC-configured env (collect_ctrac_dataset.py), not the paper''s own from-scratch
  terrain-specific policies (unavailable here) — reasoning: an untrained/barely-trained
  policy can''t cross most obstacles, starving the dataset of exactly the contact-pattern
  diversity the C-VAE needs. cvae_weights_path below warm-starts (not freezes) the
  C-VAE from that Stage I checkpoint; it keeps training jointly through Stage II via
  its own optimizer with a RISING learning-rate schedule (scheduler/scheduler_opts
  below — the inverse of every other schedule in this project), deliberately blunting
  its influence early while SAC''s rollout distribution is still far from the Stage
  I marv_rl-driven demonstrations, then ramping up as training converges closer to
  it.'
use_wandb: true
use_tensorboard: false
seed: 42
device: cuda
training_dtype: ${dtype:float32}
num_robots: 512
task: Ftr-Crossing-Direct-v0
terrain: custom_mixed
total_frames: 18284544
time_steps_per_batch: 128
replay_buffer_capacity: 500000
min_replay_size: 65536
batch_size: 256
updates_per_batch: 32
gamma: 0.995
tau: 0.01
alpha_init: 1.5
alpha_min: 0.1
fixed_alpha: false
target_entropy: -3.0
alpha_optimizer_opts:
  lr: 0.0003
loss_function: smooth_l1
cvae_updates_per_sac_step: 5
cvae_vae_beta: 0.01
cvae_free_bits: 0.5
cvae_prob_weight: 1.0
cvae_est_weight: 1.0
cvae_geo_weight: 1.0
cvae_max_reach: 0.8
eval_and_save_every: 8
eval_repeats: 2
eval_repeats_after_training: 20
max_grad_norm: 0.5
clip_grad_norm_p: 2
optimizer: ${cls:torch.optim.Adam}
optimizer_opts:
  lr: 0.0003
scheduler: ${cls:torch.optim.lr_scheduler.LinearLR}
scheduler_opts:
  start_factor: 0.1
  end_factor: 1.0
  total_iters: 800
data_collector_opts:
  split_trajs: false
policy_opts:
  actor_optimizer_opts:
    lr: 0.0003
  qvalue_optimizer_opts:
    lr: 0.0003
  cvae_optimizer_opts:
    lr: 0.0001
  history_len: 16
  latent_dim: 32
  actor_hidden:
  - 512
  - 128
  qvalue_hidden:
  - 512
  - 256
  - 128
  cvae_encoder_hidden:
  - 512
  - 256
  - 128
  cvae_decoder_hidden:
  - 128
  - 256
  - 128
  w_log_std: -4.0
  cvae_weights_path: experiments/baselines/ctrac/ctrac_dataset/ctrac_cvae_stage1.pth
ftr_obs_encoder_opts: {}
vecnorm_opts:
  decay: 0.99
  eps: 0.0001
vecnorm_on_reward: false
extra_env_transforms: []
policy_weights_path: null
vecnorm_weights_path: null
robot_max_linear_velocity: 10.0
robot_max_angular_velocity: 720.0
physx_gpu_heap_capacity: 2147483648
physx_gpu_temp_buffer_capacity: 1073741824
physx_gpu_max_num_partitions: 8
solver_position_iterations: 5
solver_velocity_iterations: 1
max_depenetration_velocity: 0.12354395702544713
sim_dt: 0.005
decimation: 20
env_cfg_overrides:
  module_name: ctrac
  sync_flipper_control: false
  flipper_control_mode: velocity
  robot_type: marv
  goal_reached_reward: 150
  failed_reward: -150
  timeout_penalty: -225
  step_penalty: 0.0
  marv_flipper_front_up_deg: 60.0
  marv_flipper_front_down_deg: 80.0
  marv_flipper_back_up_deg: 60.0
  marv_flipper_back_down_deg: 80.0
  spawn_yaw_range: 0.0
  flipper_material_friction: 10.0
  wheel_material_friction: 8.0
  body_material_friction: 0.1
  terrain_static_friction: 2
  terrain_dynamic_friction: 1.5
  shock_fail_limit: null
