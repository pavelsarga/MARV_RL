name: mitriakov_marv
comment: 'Mitriakov et al. 2021, "Reinforcement Learning Based, Staircase Negotiation
  Learning: Simulation and Transfer to Reality for Articulated Tracked Robots" (IEEE
  RA Magazine), 3-DoF/no-arm variant (matching the paper''s Absolem robot task, not
  Jaguar+arm — see the user''s notes: "uses 2DOF robotic arm ... we won''t"). Trained
  with PPO via the existing train_ftr.py (no dedicated trainer script needed) using
  MitriakovPolicyConfig (rl_modules/mitriakov/mitriakov_policy.py), a self-contained
  actor/critic MLP matching the paper''s Fig. 1 architecture (Dense->64->tanh->64->tanh->Dense).
  Unlike the paper (which trains separate ascent/descent policies, Table 2''s *-COG
  vs *-Ang variants), the "mitriakov_stairs" terrain mixes both ascending and descending
  tiles across envs (stairs_ascent_descent, alternating by tile repeat) — MitriakovModule.
  get_reward_components() picks Eq. 5''s cog_penalty vs Eq. 6''s pitch_velocity_penalty
  PER ENV by detected climb direction, training a single policy on both directions
  at once. The asymmetric flipper angle limits are ALSO per-env now: env_cfg_overrides''
  marv_flipper_*_deg below is a single, looser env-wide bound (the outer envelope,
  same for every env), while policy_opts'' mitriakov_limit_front_deg/mitriakov_limit_rear_deg
  (rl_modules/mitriakov/mitriakov_policy.py''s MitriakovFlipperBounds) is a tighter
  per-env sub-range applied only for the direction the paper actually restricts (rear
  during ascent, front during descent) — "marv can be larger than mitriakov".'
use_wandb: true
use_tensorboard: false
seed: 42
device: cuda
training_dtype: ${dtype:float32}
num_robots: 1024
task: Ftr-Crossing-Direct-v0
terrain: mitriakov_stairs
total_frames: 20971520
time_steps_per_batch: 128
epochs_per_batch: 5
frames_per_sub_batch: 4096
eval_and_save_every: 10
eval_repeats: 2
eval_repeats_after_training: 20
max_grad_norm: 0.7
clip_grad_norm_p: 2
optimizer: ${cls:torch.optim.AdamW}
optimizer_opts: {}
scheduler: ${cls:torch.optim.lr_scheduler.LinearLR}
scheduler_opts:
  start_factor: 1.0
  end_factor: 0.8
  total_iters: 160
gae_opts:
  gamma: 0.995
  lmbda: 0.95
  average_gae: false
  skip_existing: false
ppo_opts:
  clip_epsilon: 0.2
  entropy_bonus: true
  entropy_coef: 0.01
  critic_coef: 1.0
  loss_critic_type: smooth_l1
  normalize_advantage: true
  separate_losses: false
data_collector_opts:
  split_trajs: false
  compile_policy: false
  exploration_type: RANDOM
policy_config: ${cls:rl_modules.mitriakov.mitriakov_policy.MitriakovPolicyConfig}
policy_opts:
  hidden_dim: 64
  actor_optimizer_opts:
    lr: 0.0003
  value_optimizer_opts:
    lr: 0.001
  front_up_deg: 90.0
  front_down_deg: 90.0
  back_up_deg: 90.0
  back_down_deg: 90.0
  mitriakov_limit_front_deg: 5.0
  mitriakov_limit_rear_deg: 5.0
  mitriakov_trail_down_front_deg: 45.0
  mitriakov_trail_down_rear_deg: 45.0
ftr_obs_encoder_opts: {}
vecnorm_opts:
  decay: 0.99
  eps: 0.0001
vecnorm_on_reward: false
extra_env_transforms: []
policy_weights_path: null
vecnorm_weights_path: null
robot_max_linear_velocity: 10.0
robot_max_angular_velocity: 720.0
physx_gpu_heap_capacity: 2147483648
physx_gpu_temp_buffer_capacity: 1073741824
physx_gpu_max_num_partitions: 8
solver_position_iterations: 5
solver_velocity_iterations: 1
max_depenetration_velocity: 0.12354395702544713
sim_dt: 0.005
decimation: 20
env_cfg_overrides:
  fixed_forward_vel: 0.6
  module_name: mitriakov
  sync_flipper_control: true
  flipper_control_mode: position
  robot_type: marv
  goal_reached_reward: 0.0
  failed_reward: -1.0
  timeout_penalty: 0.0
  rollover_threshold_deg: 90.0
  shock_scale: 4
  shock_fail_limit: null
  marv_flipper_front_up_deg: 90.0
  marv_flipper_front_down_deg: 90.0
  marv_flipper_back_up_deg: 90.0
  marv_flipper_back_down_deg: 90.0
  clearance_coef: 0.02
  spawn_yaw_range: 0.0
  flipper_material_friction: 6.0
  wheel_material_friction: 4.0
  body_material_friction: 0.1
  terrain_static_friction: 1.2
  terrain_dynamic_friction: 0.9
