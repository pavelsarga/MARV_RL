name: ctrac_cvae_pretrain
comment: >-
  Stage I for C-TRAC (rl_modules/ctrac) — supervised-only C-VAE pretraining
  (pretrain_ctrac_cvae.py), on the dataset collect_ctrac_dataset.py produced
  (marv_config_ctrac_collect_dataset.yaml's output_path). Pure PyTorch, no Isaac Sim / GPU
  physics scene needed — runnable anywhere, including this project's local sandbox.
  output_path below feeds marv_config_ctrac.yaml's policy_opts.cvae_weights_path
  (warm start, not frozen — Stage II keeps training the C-VAE jointly).
seed: 42
device: cuda
# A directory of shard_*.pt files (collect_ctrac_dataset.py's output_path) — a single
# legacy .pt file also still works.
dataset_path: experiments/baselines/ctrac/ctrac_dataset/ctrac_stage1_shards
output_path: experiments/baselines/ctrac/ctrac_dataset/ctrac_cvae_stage1.pth
# Caps transitions loaded into RAM at once (~17.4 KB/row -> 1,000,000 rows ~= 17.4 GB);
# shards beyond this are proportionally subsampled (see pretrain_ctrac_cvae.py's
# _load_dataset), not just the earliest ones. Loading now uses mmap so this cap — not
# shard/file size — is what actually bounds peak RAM.
# Raised from 1000000, which silently discarded a third of a dataset already collected
# (30 shards x 51200 = 1,536,000 rows). This is a CAP, not a requirement — it loads
# whatever exists. Held-out contact accuracy is still climbing steeply with data and the
# train/held-out gap is still ~7 points, so rows are the single best lever here:
#     12.5k rows -> 0.679    50k -> 0.705    200k -> 0.739   (6000 steps, held out)
# Note the RAM cost, which is what the old cap was really guarding: a row is
# (history_len*251 + 1227*2) * 4 B, i.e. 25.3 KiB at history_len 16 and 13.5 KiB at 4.
# 1.5M rows = 39 GB at H=16. Keep slurm/pretrain_ctrac_cvae.sbatch's --mem ahead of it.
max_dataset_rows: 3000000
# 40000, doubled with max_dataset_rows. 20000 steps x batch 256 = 5.1M samples, which was
# ~3.4 epochs over 1.5M rows and less than 2 over a doubled dataset — too few to use the
# extra data the cap above now admits.
total_steps: 40000
batch_size: 256
history_len: 16         # must match marv_config_ctrac.yaml's policy_opts.history_len (raised 8 -> 16 there)
latent_dim: 32
encoder_hidden: [512, 256, 128]
decoder_hidden: [128, 256, 128]
# Must stay consistent with marv_config_ctrac.yaml's cvae_vae_beta/cvae_free_bits -- Stage II
# continues training this very checkpoint, so a Stage I trained under a different KL weight
# either arrives already collapsed or gets pulled apart by the change in objective.
vae_beta: 0.01
free_bits: 0.5
prob_weight: 1.0
est_weight: 1.0
geo_weight: 1.0
max_reach: 0.8
max_grad_norm: 0.5
optimizer: ${cls:torch.optim.Adam}
optimizer_opts:
  lr: 0.0003
log_every: 100
save_every: 1000
