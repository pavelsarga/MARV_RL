# Receding-horizon grid for the Phase 1 (Gaussian-head) policy: which T_o / T_a / T_p
# balance is best. Consumed by optuna_train_diffusion.py + slurm/optuna_diffusion.sbatch.
#
# This is a GRID, not a TPE search: three discrete axes should be measured at every point,
# not modelled. One SLURM array task = one point, in the order
# marv_rl_training/training/horizon_grid.py expands the axes below (history_len slowest,
# prediction_horizon fastest), skipping infeasible combinations. List them with:
#     python -m marv_rl_training.training.horizon_grid configs/optuna/optuna_diffusion_horizons.yaml
#
# DO NOT run this on a terrain the policy already saturates. On custom_mixed the T_a=1 arm
# reached 0.955, so the grid would mostly be measuring noise at the ceiling. It is built for
# the harder, wider-obstacle training env that replaces it -- point train_config at that
# env's config (or override terrain: below).
#
# Axes -- the full ranges on purpose. The custom_mixed runs (T_a=1 0.955 > T_a=4 0.894;
# T_p=16 0.876 vs T_p=4 0.894) are NOT used to prune them: those numbers come from a terrain
# the policy saturates, and whether a longer open-loop commitment or a longer plan pays off
# on harder obstacles is precisely what this grid is for.
#   history_len (T_o)          {1, 2, 4}          open question 3 in docs/diffusion_policy
#   execution_horizon (T_a)    {1, 2, 4, 8}       8 = 0.8 s open-loop, the paper's setting
#   prediction_horizon (T_p)   {4, 8, 16, 32}
# 3 x 4 x 4 = 48 combinations; horizon_grid.feasible drops T_p < T_a (T_a=8 with T_p=4), so
# 45 points. num_trials below must equal that count -- the runner refuses otherwise.
#
# Budget: each point is a full run of the base config (73.4M control frames; ~24h on an A100
# at T_a=4, ~2x longer at T_a=1 which makes 4x the policy calls per frame). 45 points at
# 4 concurrent is roughly two weeks of wall clock. Prunable points end early only if
# `pruning: true` below.

study_name: "diffusion_horizons_v1"
directions:
  - maximize
metrics_to_optimize:
  - "eval/success_rate"          # the closing 20-eval average the trainer returns
num_trials: 45                   # must equal the FEASIBLE grid size; the runner checks
gpu: 0

# How the runner picks parameters. "grid" = the explicit task->point mapping above (the only
# mode this file is meant for). "tpe" keeps optuna_train_ftr.py's TPE settings for a future
# continuous search on this trainer.
sampler: grid

# MedianPruner on the per-eval success rate the trainer reports. Off by default so every
# grid point gets its full budget and the comparison is clean; turn on to save GPU-days at
# the cost of unfinished points (their intermediate values are still recorded).
pruning: false
pruner_n_startup_trials: 4       # complete trials needed before anything is pruned
pruner_n_warmup_steps: 8         # evals a trial gets before it can be pruned (~1/3 of a run)
pruner_n_min_trials: 3

# Optional: override optuna_db.yaml (e.g. a scratch SQLite file for a smoke test).
storage_url: null

# Merged onto the base train config before the grid point is applied.
train_config_overrides: {}

optuna_keys:
  - "history_len"
  - "execution_horizon"
  - "prediction_horizon"
optuna_types:
  - "categorical"
  - "categorical"
  - "categorical"
optuna_values:
  - [1, 2, 4]
  - [1, 2, 4, 8]
  - [4, 8, 16, 32]
