name: icmd3qn_marv_paper
comment: >-
  BUG-FIXES-ONLY ablation of ICM-D3QN: the paper's reward semantics throughout, with
  none of the MARV-morphology adaptations. See the module_cfg_overrides block at the
  end of this file for exactly what is and is not applied.
  ICM-D3QN (Pan et al. 2023, "...Urban Rescuing Environments") flipper policy, reusing
  marv_asym_limits.yaml's robot/terrain/reward parameters. Front/rear flipper pairs only
  (2-DOF, 9-action discrete space) — requires sync_flipper_control: true below, which
  deviates from marv_asym_limits.yaml's 4-independent-flipper default. If you need true
  per-corner MARV control, the Q-network's action space (currently 3x3=9) needs
  extending to 3^4=81 and is out of scope for this config.
use_wandb: true
use_tensorboard: false
seed: 42
device: cuda
training_dtype: ${dtype:float32}
num_robots: 1024
task: Ftr-Crossing-Direct-v0
terrain: pan_symmetric
total_frames: ${mul:5242880,6}
time_steps_per_batch: 128
eval_and_save_every: 8
eval_repeats: 2
eval_repeats_after_training: 20
max_grad_norm: 0.697298401413678
clip_grad_norm_p: 2

# ---- Off-policy replay + optimisation ----
replay_buffer_capacity: 8000000   # transitions kept, persists across iterations (unlike PPO's on-policy buffer) — Table 2
min_replay_size: 131072           # ~1 iteration (time_steps_per_batch * num_robots) before updates start
batch_size: 256                   # Table 2
updates_per_batch: 64             # gradient steps performed per collected iteration
gamma: 0.995
target_update_interval: 1000      # gradient steps between hard target-network syncs

# ---- Epsilon-greedy exploration schedule (linear decay) ----
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_iters: null   # null = decay over the full run

optimizer: ${cls:torch.optim.AdamW}
optimizer_opts:
  lr: 0.0005   # Table 2
  weight_decay: 0.0001
scheduler: ${cls:torch.optim.lr_scheduler.LinearLR}
scheduler_opts:
  start_factor: 1.0
  end_factor: 0.8
  total_iters: ${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots}}}

data_collector_opts:
  split_trajs: false

# ICMD3QNPolicy kwargs — track_vel is the constant forward speed driving the tracks
# (the paper assumes an external operator/planner, not the D3QN network, controls this);
# hm_hidden/hm_out/fusion_hidden must match ftr_obs_encoder_opts below (same architecture,
# two separate instantiation points: FtrTorchRLEnv's Observation bookkeeping vs the actual
# training policy).
policy_opts:
  track_vel: 0.6
  hm_hidden: 32
  hm_out: 4
  fusion_hidden: 16

# Observation encoder opts for ICMD3QNObservation.get_encoder() (18-D input: 15 terrain + 3 state)
ftr_obs_encoder_opts:
  hm_hidden: 32
  hm_out: 4
  fusion_hidden: 16

# ---- Curiosity module (Eq. 11-15) — trained jointly with the Q-network on every
# sampled DQN batch, see FtrICMD3QNTrainer._icm_update / _dqn_update. ----
icm_opts:
  encoder_hidden: [32, 64]
  feature_dim: 10
  forward_hidden: 32
  inverse_hidden: 32
  eta: 1.0        # eta (Eq. 12) — intrinsic reward scale
icm_optimizer_opts:   # reuses `optimizer` (AdamW) with its own lr; falls back to optimizer_opts if empty
  lr: 0.0005   # Table 2
  weight_decay: 0.0001
icm_beta_forward: 0.8   # beta_F (Eq. 15) — Table 2
icm_beta_inverse: 0.2   # beta_I (Eq. 15) — Table 2
icm_weights_path: null  # cold start — no warm-start ICM available for this architecture yet

vecnorm_opts:
  decay: 0.99
  eps: 0.0001
# Off: none of the reproduced papers use reward normalisation, and every non-marv_rl
# observation class already sets supports_vecnorm = False, so VecNorm reduces to a no-op
# here (verified: VecNorm with empty in_keys passes the tensordict through unchanged).
# Reward scale is load-bearing for these methods' own literal reward constants.
vecnorm_on_reward: false
extra_env_transforms: []

# Cold start — no warm-start policy available for this architecture yet.
policy_weights_path: null
vecnorm_weights_path: null

robot_max_linear_velocity: 10.0
robot_max_angular_velocity: 720.0
physx_gpu_heap_capacity: 2147483648
physx_gpu_temp_buffer_capacity: 1073741824
physx_gpu_max_num_partitions: 8
solver_position_iterations: 5
solver_velocity_iterations: 1
max_depenetration_velocity: 0.12354395702544713
sim_dt: 0.005
decimation: 20

env_cfg_overrides:
  # Routes FtrEnv's observations/rewards through ICMD3QNModule (rl_modules/registry.py)
  # instead of the default marv_rl module — required for the 18-D obs this policy expects.
  module_name: icmd3qn
  # 2-DOF front/rear flipper pairs, matching the paper's action space.
  sync_flipper_control: true
  flipper_control_mode: increment
  flipper_angle_increment_deg: 15.0   # π/12
  # ICMD3QNPolicy already always emits this same constant for track_v itself (the paper's
  # action space has no velocity component — see icmd3qn_policy.py's docstring); this
  # override is a defense-in-depth backstop, not a behavior change, so it must match
  # policy_opts.track_vel above.
  fixed_forward_vel: 0.6

  robot_type: marv
  goal_reached_reward: 2
  failed_reward: -2
  timeout_penalty: -2
  # ICMD3QNModule always computes flipper_penalty/pitch_penalty/contact_penalty (their
  # magnitudes/thresholds come from rl_modules/icmd3qn/icmd3qn_module.yaml) — no
  # enable-flags needed here.
  shock_scale: 4
  # Asymmetric per-direction MARV flipper limits (degrees).
  # Front: up = negative angle, down = positive angle.
  # Rear:  up = positive angle, down = negative angle.
  marv_flipper_front_up_deg: 90.0
  marv_flipper_front_down_deg: 80.0
  marv_flipper_back_up_deg: 90.0
  marv_flipper_back_down_deg: 80.0
  spawn_yaw_range: 0.0
  flipper_material_friction: 6.0
  wheel_material_friction: 4.0
  body_material_friction: 0.1
  terrain_static_friction: 1.2
  terrain_dynamic_friction: 0.9
  shock_fail_limit: null

  # ---- Reproduction fidelity: BUG FIXES ONLY -----------------------------------------
  # This config is the ICM-D3QN ablation baseline: the corrected implementation of the
  # paper's own equations, with none of the MARV-morphology adaptations enabled. Pair it
  # with marv_config_icmd3qn.yaml to separate "the reproduction was buggy" from
  # "the paper's reward assumes a robot with main tracks".
  #
  # STILL APPLIED — corrections to the reproduction, not changes to the method (see
  # rl_modules/pan_shared.py). There is no switch for these; the previous behaviour was
  # simply wrong:
  #   * R_flipper is Eq. 4, -lambda_1 * |theta_f1 - theta*_f1|, not -lambda_1 * theta*_f1.
  #     The old form went POSITIVE whenever theta* was negative and dominated the return.
  #   * theta*_f1 is computed from the heightmap bins AHEAD of the front hinge. Row 0 of
  #     the map is the front, so the old `hmap_x_increasing: true` + `[half:n]` slice was
  #     reading the rear of the robot.
  #   * One frame throughout: the heightmap is already relative to the plane under the
  #     drive wheels, so the hinge goes in that frame instead of mixing in an absolute z.
  #   * theta* is converted from the gravity-aligned [L] frame to the chassis [R] frame,
  #     and from the papers' "up = positive" convention to MARV's (front up = negative).
  #   * Hinge offset and terrain-expansion radius come from MARV's articulation and wheel
  #     radii, not the FTR literals robot_wheel_base_length: 0.5 / robot_wheel_diam: 0.24.
  #
  # NOT APPLIED — the MARV-morphology adaptations, all disabled here:
  module_cfg_overrides:
    # Paper shapes the FRONT flipper only (its rear flipper is auxiliary; MARV's rear pair
    # is drivetrain).
    rear_flipper_shaping: false
    # Eq. 1 averaged over the full heightmap width rather than MARV's 0.36 m track
    # footprint.
    lateral_band_m: null
    # Paper's R_contact proxy: |clearance| > threshold -> -1, rather than "is each flipper
    # pair on the ground and is the belly clear". Symmetric about a nominal ride height, so
    # it penalises riding up on the flipper tracks as hard as bellying out.
    paper_contact_semantics: true
