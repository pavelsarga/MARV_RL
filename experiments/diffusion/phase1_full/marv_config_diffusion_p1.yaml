name: marv_diffusion_p1
comment: >-
  Phase 1 of the receding-horizon (Diffusion-Policy-style) policy: action chunking with a
  GAUSSIAN head, no diffusion sampler yet. The network sees the last history_len
  observations, predicts a prediction_horizon-step action trajectory, and the env wrapper
  executes the first execution_horizon steps open-loop before re-planning. Because the head
  is Gaussian over the flattened chunk, ClipPPOLoss and GAE apply unchanged — this isolates
  "does chunking help?" from "does diffusion help?", which Phase 2 answers.

  Everything not related to the horizon is copied verbatim from
  configs/baselines/marv_config_marv_rl.yaml (terrain, reward coefficients, physics,
  VecNorm, frame budget) so the comparison against that baseline means something. The two
  deliberate exceptions are flipper_control_mode (velocity -> position) and the discount
  bookkeeping described below.

  Run with: CONFIG=diffusion/marv_config_diffusion_p1.yaml TRAIN_SCRIPT=train_diffusion.py
  See docs/diffusion_policy/ for the full plan.

use_wandb: true
use_tensorboard: false
seed: 42
device: cuda
training_dtype: ${dtype:float32}
num_robots: 1024
task: Ftr-Crossing-Direct-v0
terrain: custom_mixed
# ── Receding horizon ──────────────────────────────────────────────────────────
# prediction_horizon (T_p): action steps the policy emits. Must be divisible by
#   2 ** (len(down_dims) - 1) so the U-Net can downsample the horizon axis.
# execution_horizon (T_a): how many are executed before re-planning. At the 10 Hz control
#   rate T_a=4 means 0.4 s open-loop. The paper uses 8 for manipulation; MARV drives over
#   obstacles, so we start shorter. Open question 1.
# history_len (T_o): observation frames stacked by CatFrames. The paper found >2 actively
#   HURT their CNN variant.
# T_p = T_a. Under pure RL a predicted step that is never executed is also never scored,
# so it has no gradient at all — predicting past T_a buys nothing until Phase 2, where BC
# gives the tail a regression signal. (Tested directly: T_p=16 and T_p=4 gave identical
# clip_fraction curves, so the inert tail was not the cause of the divergence either.)
prediction_horizon: 4
execution_horizon: 4
history_len: 2

# total_frames counts CONTROL steps, not macro steps, so the frame axis stays comparable
# with the baseline and slurm/lib/respawn_common.sh budgets respawns correctly. The
# collector internally sees total_frames / execution_horizon transitions.
#
# NOTE this means ~T_a times FEWER gradient steps than the baseline for the same simulation
# budget (140 iterations here vs 560 there). That is inherent to chunking — the policy makes
# fewer decisions per frame — but if Phase 1 underfits rather than plateaus, raising
# epochs_per_batch is the first knob, not total_frames.
total_frames: ${mul:5242880,14}
time_steps_per_batch: 128
# 3, not the baseline's 5. With T_a=4 the policy makes one update batch per 4 control
# steps, and 5 epochs x 32 sub-batches = 160 updates per iteration drove clip_fraction to
# 0.66 and KL to 0.09, both climbing monotonically. Measured at iteration 6-7:
#     ep=5 lr x1   clip 0.662  kl 0.089   rising
#     ep=5 lr /4   clip 0.549  kl 0.046   rising
#     ep=5 lr /2   clip 0.643  kl 0.074   rising
#     ep=2 lr x1   clip 0.131  kl 0.010   falling
#     ep=3 lr x1   clip 0.192  kl 0.014   falling   (at iteration 7 — see below)
# ⚠ ep=3 was chosen first, to buy back gradient steps, and it was WRONG. The shakedown only
# reached iteration 7, one past where the rise begins. Over 13-20 iterations of the full run
# ep=3 dips and then climbs steadily — candidate 0.195(it6) -> 0.324(it13), control
# 0.179(it6) -> 0.438(it20), KL 0.015 -> 0.047 — the same direction as the broken configs,
# just slower. ep=2 by contrast stayed flat-to-falling across all 12 of its logged
# iterations (0.261 -> 0.112). Gradient steps are scarce here, but a stable run that
# underfits beats an unstable one; see open question 14.
# The lever is the NUMBER of updates, not the step size: PPO's clipped objective has zero
# gradient outside the trust region, so at full LR the drift self-limits, while a smaller
# LR keeps more samples INSIDE the region and lets them keep moving. Lowering the LR made
# it worse. ep=3 keeps clip_fraction in band while buying back gradient steps, which
# matters because chunking already costs 4x fewer iterations per frame.
epochs_per_batch: 2
frames_per_sub_batch: 4096
eval_and_save_every: 8
eval_repeats: 2
eval_repeats_after_training: 20
max_grad_norm: 0.697298401413678
clip_grad_norm_p: 2

optimizer: ${cls:torch.optim.AdamW}
optimizer_opts: {}
scheduler: ${cls:torch.optim.lr_scheduler.LinearLR}
scheduler_opts:
  start_factor: 1.0
  end_factor: 0.8
  total_iters: ${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots},${execution_horizon}}}
step_penalty_scheduler:
  type: linear
  start_factor: 0.5
  end_factor: 1.0
  total_iters: ${intdiv:${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots},${execution_horizon}}},1}
action_bonus_coef_scheduler:
  type: linear
  start_factor: 1.0
  end_factor: 1.0
  total_iters: ${intdiv:${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots},${execution_horizon}}},1}

# control_gamma is the PER-CONTROL-STEP discount, unchanged from the baseline. GAE
# discounts MACRO steps, so its gamma is control_gamma ** execution_horizon; the reward
# aggregated over a chunk is sum_i control_gamma^i * r_i, which makes the two MDPs agree.
# Potential-based shaping stays on control_gamma (see env_cfg_overrides.shaping_gamma) —
# tying it to gae_opts.gamma, as the baseline does, would break the shaping invariance.
control_gamma: 0.9956304305372804

gae_opts:
  gamma: ${pow:${control_gamma},${execution_horizon}}
  lmbda: 0.97982059570308
  average_gae: false
  skip_existing: false
ppo_opts:
  clip_epsilon: 0.2
  entropy_bonus: true
  # ⚠ Rescaled by 1/T_p from the baseline's 0.012062144919804764.
  # ClipPPOLoss adds entropy_coef * entropy, and the entropy is now summed over the whole
  # flattened T_p x A chunk (96 dims) instead of one 6-D action. Measured on the smoke run:
  # train/mean_entropy = 64.2 nats, i.e. 0.67/dim — essentially log(2), the maximum for a
  # TanhNormal on [-1,1] — against roughly 4 nats for the baseline's 6-D action. Keeping the
  # baseline coefficient would therefore apply ~16x the entropy pressure relative to the
  # policy objective. Dividing by T_p restores per-dimension parity.
  # Watch train/mean_clip_fraction: the smoke run showed 0.38 -> 0.54 over three iterations,
  # which is above the healthy 0.1-0.3 band and is the symptom this is meant to address.
  # Three iterations at 64 envs is too little to be conclusive, so re-check on a real run.
  entropy_coef: ${div:0.012062144919804764,${prediction_horizon}}
  critic_coef: 1.0
  loss_critic_type: smooth_l1
  normalize_advantage: true
  separate_losses: false

data_collector_opts:
  split_trajs: false
  compile_policy: false
  exploration_type: RANDOM

# Receding-horizon actor-critic: shared-weight per-frame observation encoder -> FiLM-
# conditioned 1-D temporal U-Net over the horizon axis -> Gaussian over the flat chunk.
policy_config: ${cls:marv_rl_training.policies.diffusion_policy.DiffusionPolicyConfig}
policy_opts:
  prediction_horizon: ${prediction_horizon}
  history_len: ${history_len}
  # U-Net channel width per resolution level. Chosen by scripts/bench_diffusion_head.py:
  # the gate is projected TRAINING slowdown (deployment latency has ~20x headroom), and
  # [64,128] is the only size that stays under ~2x the baseline actor's per-control-step
  # cost. Measured on an RTX 2000 Ada laptop GPU, batch 1024, T_o=2/T_p=16/T_a=4:
  #   [64,128]        1.3M params   1.9x  (Phase 1)   12.3x  (Phase 2, K=8)
  #   [64,128,256]    4.7M params   4.4x              31.9x
  #   [128,256,512]  17.1M params  10.1x              77.7x
  # Those ratios are actor-forward cost in isolation; PhysX still dominates total wall
  # clock, so re-measure on the A100 before concluding a larger head is unaffordable.
  down_dims: [64, 128]
  kernel_size: 5
  n_groups: 8
  # Critic: plain MLP on its own copy of the encoder, one value per macro step.
  value_mlp_opts:
    num_hidden: 2
    hidden_dim: 256
    layernorm: true
  actor_optimizer_opts:
    lr: 0.0005029432013813284
    weight_decay: 0.0001
  value_optimizer_opts:
    lr: 0.001699179381874355
    weight_decay: 0.0001

ftr_obs_encoder_opts:
  num_hidden: 3
  hidden_dim: 256
  output_dim: 128
  layernorm: true

vecnorm_opts:
  decay: 0.99
  eps: 0.0001
vecnorm_on_reward: true
extra_env_transforms: []

# Cold start — train from scratch on MARV's native controls rather than warm-starting
# from the FTR-trained policy, since it's unclear what strategy/bias that policy already
# carries and whether it would help or hinder learning MARV-appropriate behavior.
policy_weights_path: null
vecnorm_weights_path: null

robot_max_linear_velocity: 10.0
robot_max_angular_velocity: 720.0
physx_gpu_heap_capacity: 2147483648
physx_gpu_temp_buffer_capacity: 1073741824
physx_gpu_max_num_partitions: 8
solver_position_iterations: 5
solver_velocity_iterations: 1
max_depenetration_velocity: 0.12354395702544713
sim_dt: 0.005
decimation: 20

env_cfg_overrides:
  # Routes FtrEnv's observations/rewards through MarvRLModule (rl_modules/registry.py) —
  # the project's default, but made explicit here to match every other module's config.
  module_name: marv_rl

  robot_type: marv
  # Position control, per the paper: temporal convolutions have a low-frequency bias and
  # handle velocity-command sequences badly, and position control consistently beat velocity
  # control for chunked prediction. ⚠ This bypasses the env's 5 deg/step flipper slew limit
  # (ftr_env.py:688-712), which is the only temporal smoothing the flippers currently have.
  # Watch action/chunk_step_delta_flipper; if it snaps, re-enable joint_vel_variance_coef.
  flipper_control_mode: position
  goal_reached_reward: 129.53813225921667
  failed_reward: -29.94922004490214
  shaping_coef: 72.50368190480287
  shaping_gamma: ${control_gamma}
  step_penalty: -0.11897778110727907
  action_bonus_coef: 16.29043388277351
  lin_action_ratio: 0.4006406952421414
  flipper_action_bonus_coef: 3.4183030312529787
  timeout_penalty: null
  joint_vel_variance_coef: null
  joint_angle_variance_coef: 0.26749598035386796
  joint_ang_from_flat_coef: 0.33507830419385
  flipper_contact_coef: null
  roll_coef: 2.596473423161265
  roll_rate_coef: 3.560503349946966
  pitch_coef: 2.3498290548331044
  pitch_rate_coef: 2.8641644032447258
  clearance_coef: 0.2997426405166963
  shock_coef: 15
  shock_scale: 4
  # Asymmetric per-direction MARV flipper limits (degrees).
  # Front: up = negative angle, down = positive angle.
  # Rear:  up = positive angle, down = negative angle.
  marv_flipper_front_up_deg: 60.0
  marv_flipper_front_down_deg: 80.0
  marv_flipper_back_up_deg: 60.0
  marv_flipper_back_down_deg: 80.0
  spawn_yaw_range: 0.0
  flipper_material_friction: 6.0
  wheel_material_friction: 4.0
  body_material_friction: 0.1
  terrain_static_friction: 1.2
  terrain_dynamic_friction: 0.9
  shock_fail_limit: null

log_raw_accel: false
log_raw_accel_interval: 50
