name: marv_asym_limits
comment: >-
  marv_rl — the original, full continuous 4-independent-flipper reward/observation
  module (rl_modules/marv_rl/marv_rl_module.py), the project's default before the
  atd3qn/icmd3qn/hfc/mitriakov/creps module system existed. Trained via train_ftr.py
  (PPO) using the generic MLPPolicyConfig (marv_rl_training/policies/mlp_policy.py) —
  unlike every other module, marv_rl is the one case where the generic
  encoder-combiner path is valid, since FtrTorchRLEnv's fixed OBS_KEY only happens to
  match MarvRLFlatObservation's own class name (see mitriakov_policy.py's docstring for
  why every other module needs its own self-contained policy instead). Values below are
  carried over unchanged from marv_asym_limits.yaml (asymmetric flipper limits, custom
  terrain, tuned PPO/reward coefficients) — this file just makes module routing explicit
  (env_cfg_overrides.module_name) and renames to the marv_config_<module>.yaml
  convention the other modules use.
use_wandb: true
use_tensorboard: false
seed: 42
device: cuda
training_dtype: ${dtype:float32}
num_robots: 1024
task: Ftr-Crossing-Direct-v0
terrain: custom_mixed
total_frames: ${mul:5242880,14}
time_steps_per_batch: 128
epochs_per_batch: 5
frames_per_sub_batch: 4096
eval_and_save_every: 8
eval_repeats: 2
eval_repeats_after_training: 20
max_grad_norm: 0.697298401413678
clip_grad_norm_p: 2

optimizer: ${cls:torch.optim.AdamW}
optimizer_opts: {}
scheduler: ${cls:torch.optim.lr_scheduler.LinearLR}
scheduler_opts:
  start_factor: 1.0
  end_factor: 0.8
  total_iters: ${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots}}}
step_penalty_scheduler:
  type: linear
  start_factor: 0.5
  end_factor: 1.0
  total_iters: ${intdiv:${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots}}},1}
action_bonus_coef_scheduler:
  type: linear
  start_factor: 1.0
  end_factor: 1.0
  total_iters: ${intdiv:${intdiv:${total_frames},${mul:${time_steps_per_batch},${num_robots}}},1}

gae_opts:
  gamma: 0.9956304305372804
  lmbda: 0.97982059570308
  average_gae: false
  skip_existing: false
ppo_opts:
  clip_epsilon: 0.2
  entropy_bonus: true
  entropy_coef: 0.012062144919804764
  critic_coef: 1.0
  loss_critic_type: smooth_l1
  normalize_advantage: true
  separate_losses: false

data_collector_opts:
  split_trajs: false
  compile_policy: false
  exploration_type: RANDOM

# Generic MLP actor-critic (marv_rl_training/policies/mlp_policy.py) — the only module
# that uses this path instead of a self-contained per-module policy file.
policy_config: ${cls:marv_rl_training.policies.mlp_policy.MLPPolicyConfig}
policy_opts:
  share_encoder: false
  apply_baselines_init: true
  actor_mlp_opts:
    num_hidden: 2
    hidden_dim: 128
    layernorm: false
  value_mlp_opts:
    num_hidden: 2
    hidden_dim: 256
    layernorm: true
  actor_optimizer_opts:
    lr: 0.0005029432013813284
    weight_decay: 0.0001
  value_optimizer_opts:
    lr: 0.001699179381874355
    weight_decay: 0.0001

ftr_obs_encoder_opts:
  num_hidden: 3
  hidden_dim: 256
  output_dim: 128
  layernorm: true

vecnorm_opts:
  decay: 0.99
  eps: 0.0001
vecnorm_on_reward: true
extra_env_transforms: []

# Cold start — train from scratch on MARV's native controls rather than warm-starting
# from the FTR-trained policy, since it's unclear what strategy/bias that policy already
# carries and whether it would help or hinder learning MARV-appropriate behavior.
policy_weights_path: null
vecnorm_weights_path: null

robot_max_linear_velocity: 10.0
robot_max_angular_velocity: 720.0
physx_gpu_heap_capacity: 2147483648
physx_gpu_temp_buffer_capacity: 1073741824
physx_gpu_max_num_partitions: 8
solver_position_iterations: 5
solver_velocity_iterations: 1
max_depenetration_velocity: 0.12354395702544713
sim_dt: 0.005
decimation: 20

env_cfg_overrides:
  # Routes FtrEnv's observations/rewards through MarvRLModule (rl_modules/registry.py) —
  # the project's default, but made explicit here to match every other module's config.
  module_name: marv_rl

  robot_type: marv
  goal_reached_reward: 129.53813225921667
  failed_reward: -29.94922004490214
  shaping_coef: 72.50368190480287
  shaping_gamma: ${gae_opts.gamma}
  step_penalty: -0.11897778110727907
  action_bonus_coef: 16.29043388277351
  lin_action_ratio: 0.4006406952421414
  flipper_action_bonus_coef: 3.4183030312529787
  timeout_penalty: null
  joint_vel_variance_coef: null
  joint_angle_variance_coef: 0.26749598035386796
  joint_ang_from_flat_coef: 0.33507830419385
  flipper_contact_coef: null
  roll_coef: 2.596473423161265
  roll_rate_coef: 3.560503349946966
  pitch_coef: 2.3498290548331044
  pitch_rate_coef: 2.8641644032447258
  clearance_coef: 0.2997426405166963
  shock_coef: 15
  shock_scale: 4
  # Asymmetric per-direction MARV flipper limits (degrees).
  # Front: up = negative angle, down = positive angle.
  # Rear:  up = positive angle, down = negative angle.
  marv_flipper_front_up_deg: 60.0
  marv_flipper_front_down_deg: 80.0
  marv_flipper_back_up_deg: 60.0
  marv_flipper_back_down_deg: 80.0
  spawn_yaw_range: 0.0
  flipper_material_friction: 3.0
  wheel_material_friction: 6.0
  terrain_static_friction: 0.9
  terrain_dynamic_friction: 0.7
  shock_fail_limit: null

log_raw_accel: false
log_raw_accel_interval: 50
